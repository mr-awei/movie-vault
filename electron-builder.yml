appId: com.local.videomanager
productName: 影海
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

extraResources:
  - 更新日志.md
  - CHANGELOG.en.md
  - from: src/main/assets/通用评分与简介规范.md
    to: 通用评分与简介规范.md
  - from: src/main/assets/Scoring_and_Synopsis_Guide.en.md
    to: Scoring_and_Synopsis_Guide.en.md
  - from: build/icon.png
    to: icon.png
  - from: build/yinghai-uninstall-guard.ps1
    to: yinghai-uninstall-guard.ps1

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 影海
  deleteAppDataOnUninstall: false
  differentialPackage: false
  # 安装第一步显示 MUI 语言选择框，且只加载简体中文、英文两种语言文件
  displayLanguageSelector: true
  installerLanguages: ['zh_CN', 'en_US']
  # 安装前执行 build/installer.nsh，把安装器语言写入注册表
  include: build/installer.nsh
